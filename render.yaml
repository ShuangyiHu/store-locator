services:
  - type: web
    name: store-locator-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    startCommand: sh run.sh
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: store-locator-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: store-locator-cache
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: NOMINATIM_USER_AGENT
        value: store-locator-api/1.0 (demo@example.com)
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: '["*"]'

  - type: redis
    name: store-locator-cache
    plan: free
    maxmemoryPolicy: noeviction

databases:
  - name: store-locator-db
    databaseName: store_locator
    plan: free
